
name: Build Battery Tracker APK

on:
  push:
    paths:
      - 'BatteryTracker-Android-Project.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q BatteryTracker-Android-Project.zip -d .

      - name: Build APK       
run: gradle -p BatteryTracker/BatteryTracker :app:assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryTracker-APK
          path: BatteryTracker/app/build/outputs/apk/debug/app-debug.apk
          
