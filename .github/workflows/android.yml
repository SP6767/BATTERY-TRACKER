
name: Build CellTrace APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          find_project() {
            find "$1" \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
          }

          SETTINGS=$(find_project . | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "No Android project found. Checking ZIP archives..."

            mkdir -p "$RUNNER_TEMP/celltrace-unpacked"

            while IFS= read -r -d '' ZIP; do
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/celltrace-unpacked"
            done < <(find . -type f -name '*.zip' -print0)

            SETTINGS=$(find_project "$RUNNER_TEMP/celltrace-unpacked" | head -n 1 || true)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            echo "Check that the CellTrace source project or ZIP is uploaded."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build CellTrace APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CellTrace-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
